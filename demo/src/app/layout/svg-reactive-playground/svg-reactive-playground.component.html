<section class="playground">

    <!-- Code snippet -->
    <div class="playground__code">
        <button
                class="playground__code_copy"
                type="button"
                (click)="copyCode()"
                title="Copy code">
            ⧉
        </button>
        <demo-highlighted-code [code]="codeTemplate"></demo-highlighted-code>
    </div>

    <!-- Form -->
    <div class="playground__form">

        <form [formGroup]="form">
            <demo-form-group-renderer
                    [form]="form"
                    [radioOptions]="radioOptions"
            >
            </demo-form-group-renderer>
        </form>
        <div class="playground__actions">
            <button type="button" (click)="reset()">Reset</button>
        </div>
    </div>

    <!-- Preview -->
    <svg-canvas class="playground__preview"
                [viewBox]="'0 0 200 200'"
    >
        <svg:g canvas>
            <ng-content select="[demo-preview]"></ng-content>
        </svg:g>
    </svg-canvas>

</section>
