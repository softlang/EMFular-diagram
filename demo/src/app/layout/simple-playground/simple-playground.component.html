<section class="playground">

    <!-- Code snippet -->
    <div class="playground__code">
        <button
                class="playground__code_copy"
                type="button"
                (click)="copyCode()"
                title="Copy code">
            ⧉
        </button>

        <pre><code>{{ codeTemplate }}</code></pre>
    </div>

    <!-- Form -->
    <div class="playground__form">
        <form [formGroup]="form">
            @for (entry of formControls; track entry[0]) {
                <label>
                    {{ entry[0]+":" }}

                    <input
                            [type]="InputType[inputTypes[entry[0]]]"
                            [formControlName]="entry[0]">
                </label>
            }
        </form>
        <div class="playground__actions">
            <button type="button" (click)="reset()">Reset</button>
        </div>
    </div>

    <!-- Preview -->
    <div class="playground__preview">
        <model-canvas
                [svgwidth]="200"
                [svgheigth]="200"
        >
            <svg:g canvas>
                <ng-content select="[demo-preview]"></ng-content>
            </svg:g>
        </model-canvas>
    </div>

</section>
