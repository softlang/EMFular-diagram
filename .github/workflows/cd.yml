name: CD

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  release:
    name: Publish package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify tag is on main
        run: |
          git fetch origin main

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "You may only create releases from main."
            echo "The tagged commit $GITHUB_SHA is not part of origin/main."
            exit 1
          fi

          echo "Tag points to a commit on main"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Install Playwright browsers (for vitest browser tests)
        run: npx playwright install --with-deps chromium

      - name: test
        run: npm run test

      - run: npm run build

      - name: Check package version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF#refs/tags/v}
          
          if [ "$VERSION" != "$TAG" ]; then
            echo "Version mismatch!"
            echo "package.json contains version $VERSION"
            echo "but the tag is v$TAG"
            exit 1
          fi
          echo "Versions match: $VERSION"

      - name: Debug publish
        working-directory: dist
        run: |
          npm --version
          node --version
          npm whoami || true
          npm publish --dry-run

      - name: Check OIDC environment
        run: |
          echo "ACTIONS_ID_TOKEN_REQUEST_URL=${ACTIONS_ID_TOKEN_REQUEST_URL:+present}"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN=${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+present}"

      - name: Print GitHub context
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Workflow ref: $GITHUB_WORKFLOW_REF"
          echo "Workflow: $GITHUB_WORKFLOW"
          echo "Ref: $GITHUB_REF"
          echo "SHA: $GITHUB_SHA"

      - name: Publish
        id: publish
        working-directory: dist
        continue-on-error: true
        run: npm publish

      - name: Show npm debug log
        if: always()
        run: |
          echo "===== npm logs ====="
          ls -l /home/runner/.npm/_logs
          for f in /home/runner/.npm/_logs/*; do
            echo
            echo "===== $f ====="
            cat "$f"
          done

      - name: Fail if publish failed
        if: steps.publish.outcome != 'success'
        run: exit 1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2