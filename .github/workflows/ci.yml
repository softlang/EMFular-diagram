name: test_and_testbuild
on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    name: Test (vitest) and build (via ng-packagr)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Build library
        run: npm run build