<svg:g #arrow>
  <g arrow-between-boxes *ngIf="start && end"
       [start]="start"
       [end]="end"
       [arrowType]="arrowType"
       [text]="text"
       [style]="style"
       [bent]="bent"
       [controlPoints]="controlPoints"
       [startAnchor]="startAnchor"
       [endAnchor]="endAnchor"
       [editable]="editable"
       (geometryChange)="geometryChange.emit($event)"
       (controlPointsChange)="controlPointsChange.emit($event)"
       (startAnchorChange)="startAnchorChange.emit($event)"
       (endAnchorChange)="endAnchorChange.emit($event)">
  </g>
</svg:g>
