<svg:text text-style
    [textStyle]="textStyle"
    [attr.x]="x" [attr.y]="y" [attr.width]="w" [attr.height]="h"
    dy="0" (click)="handleClick()"
>
  <tspan dy="1.2em" [attr.x]="x" *ngFor="let line of distributedText">{{line}}</tspan>
</svg:text>
<svg:foreignObject  *ngIf="isActive" [attr.x]="x" [attr.y]="y" [attr.width]="w" [attr.height]="h">
  <textarea class="html-text-area" [(ngModel)]="this.text" (focusout)="leaveTextInput()"
         [style.font-family]="textStyle['font-family']"
         [style.font-size]="textStyle['font-size']"
         [style.font-weight]="textStyle['font-weight']"
         [style.font-style]="textStyle['font-style']"
         [style.color]="textStyle.fill"
  ></textarea>
</svg:foreignObject>
