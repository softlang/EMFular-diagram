<svg:g>
    <path [attr.id]="id+'-path'"
          [attr.d]="'M '+startX+','+startY+' L '+endX+','+endY"
          [attr.stroke]="arrowStyle.color"
          [attr.stroke-dasharray]="arrowStyle.strokeDashArray"
          [attr.stroke-width]="arrowStyle.strokeWidth"
          [attr.marker-start]='"url(#"+arrowStyle.startPointer+")"'
          [attr.marker-end]='"url(#"+arrowStyle.endPointer+")"'
    >
    </path>
    <text *ngIf="text"
          [attr.fill]="textStyle['fill']"
          [attr.font-family]="textStyle['font-family']"
          [attr.font-size]="textStyle['font-size']"
          [attr.font-weight]="textStyle['font-weight']"
          [attr.font-style]="textStyle['font-style']"
          [attr.text-anchor]="textStyle['text-anchor']"
    >
        <textPath
            [attr.href]="'#'+id+'-path'"
            [attr.startOffset]="textStyle['startOffset']"
            [attr.method]="textStyle['method']"
            [attr.spacing]="textStyle['spacing']"
            [attr.side]="textStyle['side']"
            [attr.lengthAdjust]="textStyle['lengthAdjust']"
            [attr.textLength]="textStyle['textLength']"
        >
            {{text}}
        </textPath>
    </text>
</svg:g>