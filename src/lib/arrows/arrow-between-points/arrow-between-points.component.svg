<svg:g>
    <path [attr.id]="id+'-path'"
          [attr.d]="'M '+startX+','+startY+' L '+endX+','+endY"
          [style.stroke]="arrowStyle.color"
          [style.stroke-dasharray]="arrowStyle.strokeDashArray"
          [style.stroke-width]="arrowStyle.strokeWidth"
          [style.marker-start]='"url(#"+arrowStyle.startPointer+")"'
          [style.marker-end]='"url(#"+arrowStyle.endPointer+")"'
    >
    </path>
    <text *ngIf="text" [style]="textStyle">
        <textPath [attr.href]="'#'+id+'-path'" [style]="textPathStyle">
            {{text}}
        </textPath>
    </text>
</svg:g>