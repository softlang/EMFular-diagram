<svg:g>
    <path [attr.id]="id+'-path'"
          [attr.d]="'M '+startX+','+startY+' L '+endX+','+endY"
          [style]="lineStyleConfiguration.style? lineStyleConfiguration.style: style"
          [style.stroke]="lineStyleConfiguration.color"
          [style.stroke-dasharray]="lineStyleConfiguration.dashed"
          [style.marker-start]='"url(#"+lineStyleConfiguration.startPointer+")"'
          [style.marker-end]='"url(#"+lineStyleConfiguration.endPointer+")"'
    >
    </path>
    <text *ngIf="text" [style]="textStyle">
        <textPath [attr.href]="'#'+id+'-path'" [style]="textPathStyle">
            {{text}}
        </textPath>
    </text>
</svg:g>