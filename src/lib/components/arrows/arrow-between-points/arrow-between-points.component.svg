<svg:g>
    <path [attr.id]="id+'-path'"
          [attr.d]="'M '+startX+','+startY+' L '+endX+','+endY"
          [style]="style"
          [style.stroke]="arrowStyleConfiguration.color"
          [style.stroke-dasharray]="arrowStyleConfiguration.dashed.join(' ')"
          [style.marker-start]='"url(#"+arrowStyleConfiguration.startPointer+")"'
          [style.marker-end]='"url(#"+arrowStyleConfiguration.endPointer+")"'
    >
    </path>
    <text *ngIf="text" [style]="textStyle">
        <textPath [attr.href]="'#'+id+'-path'" [style]="textPathStyle">
            {{text}}
        </textPath>
    </text>
</svg:g>