<svg:g [attr.id]="id">
    <g rectangleG
       [position]="position"
       [color]="color">
    </g>
    <g text-area-svg
       [singleEdit]="true"
       [(text)]="text"
       (textChange)="onTextChange($event)"
       [x]="position.x"
       [y]="position.y"
       [w]="position.w"
       [h]="position.h"
       [textStyle]="textStyle">
    </g>
</svg:g>